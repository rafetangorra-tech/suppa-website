<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Paparazzi Panic — SUPPA</title>
  <meta name="description" content="Paparazzi Panic — the Drama Queen arcade. Blow kisses, dodge the flashes, survive the wave.">
  <meta property="og:title" content="Paparazzi Panic — SUPPA">
  <meta property="og:description" content="The Drama Queen arcade: blow kisses, dodge the flashes.">
  <meta property="og:image" content="assets/cover.jpg">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #0b0b0d; --pink: #ff4fa3; --mint: #a8f0c6;
      --text: #f2f2f4; --muted: #a09aa4;
      --font-display: "Unbounded", "Arial Black", sans-serif;
      --font-sans: "Archivo", system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(60% 40% at 50% 0%, rgba(255, 79, 163, 0.12), transparent 70%),
        var(--canvas);
      color: var(--text);
      font-family: var(--font-sans);
      display: flex; flex-direction: column;
      overflow: hidden;
      touch-action: none;
    }
    ::selection { background: var(--mint); color: #0b0b0d; }

    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem clamp(1.2rem, 4vw, 2.5rem);
      flex: 0 0 auto;
    }
    .nav a {
      color: var(--text); text-decoration: none;
      font-family: var(--font-display);
      font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase;
      opacity: 0.8; transition: opacity 0.2s;
    }
    .nav a:hover { opacity: 1; }
    .nav__pill {
      border: 1px solid rgba(255, 79, 163, 0.6);
      border-radius: 999px; padding: 0.42rem 1rem;
    }

    .head { text-align: center; flex: 0 0 auto; padding: 0 1rem; }
    .head p {
      color: var(--mint);
      font-family: var(--font-display);
      font-size: 0.58rem; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
    }
    .head h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(1.4rem, 5vw, 2.6rem);
      color: var(--pink);
      text-transform: uppercase;
      line-height: 1.05;
      margin-top: 0.35rem;
    }

    .stage {
      flex: 1 1 auto;
      display: flex; align-items: center; justify-content: center;
      padding: 0.8rem 1rem 0.4rem;
      min-height: 0;
    }
    .frame {
      position: relative;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 480 / 640;
      max-width: 94vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.65),
        0 0 0 1px #26262b,
        0 0 90px rgba(255, 79, 163, 0.12);
      background: #0d0d10;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* soft CRT scanlines over the game */
    .frame::after {
      content: "";
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 3px);
      mix-blend-mode: overlay;
    }

    .hint {
      flex: 0 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      padding: 0.55rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
    }
    .hint b { color: var(--mint); font-weight: 700; }
    #mute {
      background: none; border: 1px solid #2c2c31; border-radius: 999px;
      color: var(--muted); font: inherit; cursor: pointer;
      padding: 0.1rem 0.6rem; margin-left: 0.6rem;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="index.html">← SUPPA</a>
    <a class="nav__pill" href="index.html#booking">Booking</a>
  </nav>

  <div class="head">
    <p>the drama queen arcade</p>
    <h1>Paparazzi Panic</h1>
  </div>

  <div class="stage">
    <div class="frame">
      <canvas id="game"></canvas>
    </div>
  </div>

  <p class="hint">
    <b>drag</b> or <b>← →</b> to move — kisses fire themselves. Dodge the flashes.
    <button id="mute" aria-label="Toggle sound">sound: on</button>
  </p>

  <script>
  (function () {
    'use strict';

    /* ---------- stage ---------- */
    var W = 480, H = 640;
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d');
    function fit() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fit(); window.addEventListener('resize', fit);

    var PINK = '#ff4fa3', MINT = '#a8f0c6', INK = '#0b0b0d', WHITE = '#f2f2f4';

    /* ---------- tiny synth (no assets) ---------- */
    var AC = window.AudioContext || window.webkitAudioContext;
    var ac = null, muted = false;
    function beep(freq, dur, type, vol, slide) {
      if (muted) return;
      if (!ac) { try { ac = new AC(); } catch (e) { return; } }
      if (ac.state === 'suspended') ac.resume();
      var o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, ac.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), ac.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.05, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + dur);
    }
    var sfx = {
      kiss: function () { beep(880, 0.07, 'square', 0.03); },
      pop: function () { beep(520, 0.12, 'square', 0.05, -300); },
      hit: function () { beep(140, 0.3, 'sawtooth', 0.08, -80); },
      wave: function () { beep(440, 0.1, 'square', 0.04); setTimeout(function () { beep(660, 0.1, 'square', 0.04); }, 90); setTimeout(function () { beep(880, 0.14, 'square', 0.04); }, 180); },
    };
    /* the single behind the game — parked for now; flip to true at release */
    var BGM_ENABLED = false;
    var bgm = BGM_ENABLED ? new Audio('assets/drama-queen.m4a') : null;
    if (bgm) { bgm.loop = true; bgm.volume = 0.55; bgm.preload = 'auto'; }
    var bgmStarted = false;
    window.__pp = { bgm: bgm }; // debug/tuning handle

    var muteBtn = document.getElementById('mute');
    muteBtn.addEventListener('click', function () {
      muted = !muted;
      if (bgm) bgm.muted = muted;
      muteBtn.textContent = 'sound: ' + (muted ? 'off' : 'on');
    });
    window.addEventListener('keydown', function (e) { if (e.key === 'm' || e.key === 'M') muteBtn.click(); });

    /* ---------- state ---------- */
    var STATE = 'title'; // title | playing | over
    var score = 0, wave = 0, lives = 3;
    var hs = 0;
    try { hs = parseInt(localStorage.getItem('suppa_arcade_hs') || '0', 10) || 0; } catch (e) {}

    var player, kisses, cams, bolts, parts, stars;
    var fireTimer = 0, stepTimer = 0, stepDir = 1, stepEvery = 0.9;
    var shake = 0, flashT = 0, iframes = 0, waveBanner = 0;
    var keys = {};

    function reset() {
      score = 0; wave = 0; lives = 3;
      player = { x: W / 2, y: H - 58, w: 44, h: 30, tx: W / 2 };
      kisses = []; bolts = []; parts = [];
      newWave();
    }

    function newWave() {
      wave++;
      cams = [];
      var cols = Math.min(5 + Math.floor((wave - 1) / 2), 8);
      var rows = Math.min(3 + Math.floor((wave - 1) / 3), 5);
      var gx = 52, gy = 46;
      var ox = (W - (cols - 1) * gx) / 2;
      for (var r = 0; r < rows; r++)
        for (var c = 0; c < cols; c++)
          cams.push({ x: ox + c * gx, y: 86 + r * gy, w: 34, h: 24, flash: 0 });
      stepDir = 1;
      stepEvery = Math.max(0.16, 0.85 - wave * 0.06);
      stepTimer = 0;
      waveBanner = 1.6;
      if (wave > 1) { score += 50; sfx.wave(); }
    }

    /* backdrop stars — slow pink/mint dust */
    stars = [];
    for (var i = 0; i < 60; i++)
      stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.6 + 0.4, v: Math.random() * 12 + 4, c: Math.random() < 0.5 ? PINK : MINT, a: Math.random() * 0.5 + 0.15 });

    /* ---------- input ---------- */
    window.addEventListener('keydown', function (e) {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Enter') { advance(); e.preventDefault(); }
    });
    window.addEventListener('keyup', function (e) { keys[e.key] = false; });

    function canvasX(e) {
      var r = canvas.getBoundingClientRect();
      var cx = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
      return cx / r.width * W;
    }
    var dragging = false;
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      if (player) player.tx = canvasX(e);
      advance();
    });
    window.addEventListener('pointermove', function (e) {
      if (dragging && player) player.tx = canvasX(e);
    });
    window.addEventListener('pointerup', function () { dragging = false; });

    function advance() {
      if (STATE === 'title' || STATE === 'over') {
        reset(); STATE = 'playing';
        /* first tap doubles as the autoplay gesture */
        if (bgm) bgm.play().then(function () { bgmStarted = true; }).catch(function () {});
      }
    }

    document.addEventListener('visibilitychange', function () {
      paused = document.hidden;
      last = performance.now();
      if (bgmStarted) {
        if (paused) bgm.pause();
        else bgm.play().catch(function () {});
      }
    });

    /* ---------- update ---------- */
    var last = performance.now(), paused = false;

    function update(dt) {
      for (var i = 0; i < stars.length; i++) {
        stars[i].y += stars[i].v * dt;
        if (stars[i].y > H) { stars[i].y = -2; stars[i].x = Math.random() * W; }
      }
      if (STATE !== 'playing') return;

      /* player */
      var sp = 340;
      if (keys.ArrowLeft || keys.a || keys.A) player.tx = player.x - sp * dt * 1.4;
      if (keys.ArrowRight || keys.d || keys.D) player.tx = player.x + sp * dt * 1.4;
      player.tx = Math.max(28, Math.min(W - 28, player.tx));
      player.x += (player.tx - player.x) * Math.min(1, dt * 14);

      /* auto-fire */
      fireTimer -= dt;
      if (fireTimer <= 0) {
        kisses.push({ x: player.x, y: player.y - 22, v: 460 });
        fireTimer = 0.32;
        sfx.kiss();
      }
      for (i = kisses.length - 1; i >= 0; i--) {
        kisses[i].y -= kisses[i].v * dt;
        if (kisses[i].y < -20) kisses.splice(i, 1);
      }

      /* camera ranks step like the classics: sideways, then drop */
      stepTimer += dt;
      var alive = cams.length;
      var quicken = 1 + (1 - alive / Math.max(1, (5 + Math.floor((wave - 1) / 2)) * (3 + Math.floor((wave - 1) / 3)))) * 1.6;
      if (stepTimer >= stepEvery / quicken) {
        stepTimer = 0;
        var minX = 1e9, maxX = -1e9, maxY = -1e9;
        for (i = 0; i < cams.length; i++) { minX = Math.min(minX, cams[i].x); maxX = Math.max(maxX, cams[i].x); maxY = Math.max(maxY, cams[i].y); }
        var drop = (stepDir > 0 && maxX > W - 46) || (stepDir < 0 && minX < 46);
        for (i = 0; i < cams.length; i++) {
          if (drop) cams[i].y += 22; else cams[i].x += stepDir * 16;
        }
        if (drop) stepDir *= -1;
        if (maxY > player.y - 46) loseLife(true);
      }

      /* cameras flash (shoot) */
      var rate = 0.55 + wave * 0.22;
      for (i = 0; i < cams.length; i++) {
        cams[i].flash = Math.max(0, cams[i].flash - dt);
        if (Math.random() < rate * dt / Math.max(6, cams.length) * 10) {
          cams[i].flash = 0.12;
          bolts.push({ x: cams[i].x, y: cams[i].y + 14, v: 210 + wave * 22 });
        }
      }
      for (i = bolts.length - 1; i >= 0; i--) {
        bolts[i].y += bolts[i].v * dt;
        if (bolts[i].y > H + 20) bolts.splice(i, 1);
      }

      /* kisses hit cameras */
      for (i = kisses.length - 1; i >= 0; i--) {
        for (var j = cams.length - 1; j >= 0; j--) {
          if (Math.abs(kisses[i].x - cams[j].x) < 20 && Math.abs(kisses[i].y - cams[j].y) < 16) {
            burst(cams[j].x, cams[j].y);
            cams.splice(j, 1); kisses.splice(i, 1);
            score += 10; sfx.pop();
            break;
          }
        }
      }
      if (!cams.length) newWave();

      /* bolts hit the queen */
      iframes = Math.max(0, iframes - dt);
      for (i = bolts.length - 1; i >= 0; i--) {
        if (Math.abs(bolts[i].x - player.x) < 20 && Math.abs(bolts[i].y - player.y) < 16) {
          bolts.splice(i, 1);
          if (!iframes) loseLife(false);
        }
      }

      for (i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt; p.t -= dt;
        if (p.t <= 0) parts.splice(i, 1);
      }

      shake = Math.max(0, shake - dt * 30);
      flashT = Math.max(0, flashT - dt);
      waveBanner = Math.max(0, waveBanner - dt);
    }

    function loseLife(fromReach) {
      lives--; shake = 9; flashT = 0.18; iframes = 1.4; sfx.hit();
      if (fromReach) { // ranks reached the carpet: push them back up
        for (var i = 0; i < cams.length; i++) cams[i].y -= 90;
      }
      if (lives <= 0) {
        STATE = 'over';
        if (score > hs) { hs = score; try { localStorage.setItem('suppa_arcade_hs', String(hs)); } catch (e) {} }
      }
    }

    function burst(x, y) {
      for (var i = 0; i < 14; i++) {
        var a = Math.random() * Math.PI * 2, v = Math.random() * 160 + 40;
        parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: Math.random() * 0.5 + 0.2, c: Math.random() < 0.6 ? PINK : MINT });
      }
    }

    /* ---------- draw ---------- */
    function heart(x, y, s, color) {
      ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-5, -3, -12, 1, 0, 10);
      ctx.bezierCurveTo(12, 1, 5, -3, 0, 3);
      ctx.fillStyle = color; ctx.fill();
      ctx.restore();
    }

    function crown(x, y, blink) {
      ctx.save(); ctx.translate(x, y);
      if (blink && Math.floor(performance.now() / 90) % 2) ctx.globalAlpha = 0.35;
      ctx.shadowColor = PINK; ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.moveTo(-22, 12); ctx.lineTo(-22, -4); ctx.lineTo(-11, 5); ctx.lineTo(0, -14);
      ctx.lineTo(11, 5); ctx.lineTo(22, -4); ctx.lineTo(22, 12); ctx.closePath();
      ctx.fillStyle = PINK; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = MINT;
      ctx.beginPath(); ctx.arc(-22, -6, 3, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -16, 3.4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(22, -6, 3, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillRect(-22, 8, 44, 4);
      ctx.restore();
    }

    function camera(c) {
      ctx.save(); ctx.translate(c.x, c.y);
      ctx.fillStyle = '#1d1d22';
      ctx.strokeStyle = '#2f2f36'; ctx.lineWidth = 1.5;
      roundRect(-17, -11, 34, 22, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#141418';
      ctx.fillRect(-8, -15, 16, 5);
      ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, 7);
      ctx.fillStyle = c.flash > 0 ? '#ffffff' : MINT; ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, 3.4, 0, 7);
      ctx.fillStyle = c.flash > 0 ? '#fff' : '#0e2a1c'; ctx.fill();
      if (c.flash > 0) {
        ctx.globalAlpha = c.flash / 0.12 * 0.9;
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      }
      ctx.fillStyle = PINK;
      ctx.fillRect(11, -8, 3, 3);
      ctx.restore();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function text(str, x, y, size, color, font, align) {
      ctx.fillStyle = color;
      ctx.font = font === 'd' ? '900 ' + size + 'px Unbounded'
               : font === 'u' ? '600 ' + size + 'px Unbounded'
               : '700 ' + size + 'px Archivo';
      ctx.textAlign = align || 'center';
      ctx.fillText(str, x, y);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      var sx = shake ? (Math.random() - 0.5) * shake : 0;
      var sy = shake ? (Math.random() - 0.5) * shake : 0;
      ctx.save(); ctx.translate(sx, sy);

      /* stage backdrop */
      var g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0d0d11'); g.addColorStop(0.75, '#120810'); g.addColorStop(1, '#1a0a12');
      ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
      for (var i = 0; i < stars.length; i++) {
        ctx.globalAlpha = stars[i].a;
        ctx.fillStyle = stars[i].c;
        ctx.fillRect(stars[i].x, stars[i].y, stars[i].s, stars[i].s);
      }
      ctx.globalAlpha = 1;
      /* the red carpet */
      ctx.fillStyle = 'rgba(232, 67, 45, 0.22)';
      ctx.fillRect(0, H - 34, W, 34);
      ctx.fillStyle = 'rgba(255, 79, 163, 0.4)';
      ctx.fillRect(0, H - 34, W, 2);

      if (STATE === 'playing' || STATE === 'over') {
        for (i = 0; i < kisses.length; i++) heart(kisses[i].x, kisses[i].y, 1.15, PINK);
        for (i = 0; i < cams.length; i++) camera(cams[i]);
        ctx.fillStyle = '#fff';
        for (i = 0; i < bolts.length; i++) {
          ctx.save(); ctx.translate(bolts[i].x, bolts[i].y);
          ctx.shadowColor = '#fff'; ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(0, -8); ctx.lineTo(3.4, -1); ctx.lineTo(0.8, -1); ctx.lineTo(2.6, 8); ctx.lineTo(-3.4, 0); ctx.lineTo(-0.8, 0);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
        for (i = 0; i < parts.length; i++) {
          ctx.globalAlpha = Math.min(1, parts[i].t * 3);
          ctx.fillStyle = parts[i].c;
          ctx.fillRect(parts[i].x, parts[i].y, 3, 3);
        }
        ctx.globalAlpha = 1;
        if (STATE === 'playing') crown(player.x, player.y, iframes > 0);

        /* HUD */
        text('DRAMA PTS ' + score, 14, 28, 11, MINT, 'u', 'left');
        for (i = 0; i < 3; i++) heart(W - 22 - i * 22, 22, 1.35, i < lives ? PINK : 'rgba(255,255,255,0.12)');
        if (waveBanner > 0 && STATE === 'playing') {
          ctx.globalAlpha = Math.min(1, waveBanner);
          text('WAVE ' + wave, W / 2, H / 2 - 60, 30, PINK, 'd');
          ctx.globalAlpha = 1;
        }
      }

      if (STATE === 'title') {
        crown(W / 2, H / 2 - 116, false);
        text('PAPARAZZI', W / 2, H / 2 - 46, 34, PINK, 'd');
        text('PANIC', W / 2, H / 2 - 6, 34, PINK, 'd');
        text('the cameras found her.', W / 2, H / 2 + 40, 15, WHITE, 's');
        text('blow kisses. dodge the flashes.', W / 2, H / 2 + 62, 15, WHITE, 's');
        text('tap or press space to start', W / 2, H / 2 + 120, 13, MINT, 's');
        if (hs) text('best: ' + hs, W / 2, H / 2 + 148, 12, '#a09aa4', 's');
      }

      if (STATE === 'over') {
        ctx.fillStyle = 'rgba(11, 11, 13, 0.72)';
        ctx.fillRect(0, 0, W, H);
        text('THE DRAMA', W / 2, H / 2 - 66, 30, PINK, 'd');
        text('GOT HER', W / 2, H / 2 - 28, 30, PINK, 'd');
        text('drama pts: ' + score, W / 2, H / 2 + 18, 16, WHITE, 's');
        text(score >= hs && score > 0 ? 'new best!' : 'best: ' + hs, W / 2, H / 2 + 44, 14, MINT, 's');
        text('tap or press space for an encore', W / 2, H / 2 + 96, 13, MINT, 's');
      }

      ctx.restore();
      if (flashT > 0) {
        ctx.globalAlpha = flashT / 0.18 * 0.5;
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, W, H);
        ctx.globalAlpha = 1;
      }
    }

    /* ---------- loop ---------- */
    function frame(now) {
      var dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (!paused) { update(dt); draw(); }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
